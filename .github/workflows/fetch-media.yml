# Downloads KUC images and WordPress catalogues into media/ (see scripts/fetch-media.mjs).
# Runs when media/manifest.json changes, or by hand from the Actions tab.
name: Fetch KUC media
on:
  push:
    paths: [media/manifest.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency: fetch-media
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-media.mjs
      - name: Commit downloads
        run: |
          git config user.name "kuc-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media
          git diff --cached --quiet || git commit -m "Fetch KUC media [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
