# Downloads KUC images and WordPress catalogues into media/ (see scripts/fetch-media.mjs).
# Runs when media/manifest.json changes, or by hand from the Actions tab.
name: Fetch KUC media
on:
  push:
    paths: [media/manifest.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency: fetch-media
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-media.mjs
      # PDFs aren't committed (too big). Keep their text, page count and a small cover image,
      # which is what's needed to turn a report into a page.
      - name: Extract PDF text and covers
        run: |
          if [ -d media/pdfs ]; then
            sudo apt-get install -y -q poppler-utils > /dev/null
            echo "{" > media/pdf-info.json; first=1
            find media/pdfs -name "*.pdf" | sort | while read f; do
              rel="${f#media/pdfs/}"; base="${rel%.pdf}"
              mkdir -p "media/pdf-text/$(dirname "$rel")" "public/media/pdf-covers/$(dirname "$rel")"
              pdftotext -layout "$f" "media/pdf-text/$base.txt" || true
              # Image-only PDFs (designed booklets, scanned reports): read the text with OCR.
              if [ "$(wc -w < "media/pdf-text/$base.txt" 2>/dev/null || echo 0)" -lt 50 ] && [ "$(stat -c %s "$f")" -lt 30000000 ]; then
                command -v tesseract > /dev/null || sudo apt-get install -y -q tesseract-ocr > /dev/null
                tmp=$(mktemp -d); pdftoppm -r 150 -png "$f" "$tmp/p"
                for img in "$tmp"/p-*.png; do tesseract "$img" - 2>/dev/null; echo; echo "--- page break ---"; done > "media/pdf-text/$base.txt"
                rm -rf "$tmp"
              fi
              pdftoppm -f 1 -l 1 -jpeg -jpegopt quality=80 -scale-to 900 "$f" "public/media/pdf-covers/$base" || true
              mv "public/media/pdf-covers/$base"-*.jpg "public/media/pdf-covers/$base.jpg" 2>/dev/null || true
              pages=$(pdfinfo "$f" 2>/dev/null | awk '/^Pages:/{print $2}')
              size=$(stat -c %s "$f")
              [ $first -eq 1 ] || echo "," >> media/pdf-info.json; first=0
              printf '  "%s": {"pages": %s, "bytes": %s}' "$rel" "${pages:-0}" "$size" >> media/pdf-info.json
            done
            echo "" >> media/pdf-info.json; echo "}" >> media/pdf-info.json
            rm -rf media/pdfs
          fi
      - name: Commit downloads
        run: |
          git config user.name "kuc-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media public/media/pdf-covers
          git diff --cached --quiet || git commit -m "Fetch KUC media [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
